      '<xf numFmtId="0" fontId="2" fillId="5" borderId="0" xfId="0" applyFill="1" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="6" borderId="0" xfId="0" applyFill="1" applyFont="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '</cellXfs></styleSheet>' }
  ];
  sheets.forEach((s, i) => files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: sheetXml(s.rows, s.w, rtl) }));
  return Zip.build(files);
}

/* ============================================================
   23. POWERPOINT  (.pptx)
   ============================================================ */
function pptText(x, y, w, h, runs, opts) {
  opts = opts || {};
  const paras = (Array.isArray(runs) ? runs : [runs]).map(r => {
    const o = Object.assign({ size: 1400, bold: false, color: "203864", align: opts.align || (LANG === "ar" ? "r" : "l") }, r);
    return '<a:p><a:pPr algn="' + o.align + '"' + (LANG === "ar" ? ' rtl="1"' : "") + '/>' +
      '<a:r><a:rPr lang="' + (LANG === "ar" ? "ar-SA" : "en-US") + '" sz="' + o.size + '"' +
      (o.bold ? ' b="1"' : "") + ' dirty="0"><a:solidFill><a:srgbClr val="' + o.color + '"/></a:solidFill>' +
      '<a:latin typeface="Calibri"/></a:rPr><a:t>' + xml(o.text) + '</a:t></a:r></a:p>';
  }).join("");
  return '<p:sp><p:nvSpPr><p:cNvPr id="' + (100 + Math.floor(Math.random() * 9000)) + '" name="tx"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>' +
    '<p:spPr><a:xfrm><a:off x="' + x + '" y="' + y + '"/><a:ext cx="' + w + '" cy="' + h + '"/></a:xfrm>' +
    '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom>' +
    (opts.fill ? '<a:solidFill><a:srgbClr val="' + opts.fill + '"/></a:solidFill>' : '<a:noFill/>') + '</p:spPr>' +
    '<p:txBody><a:bodyPr wrap="square" lIns="91440" rIns="91440" tIns="45720" bIns="45720" anchor="ctr"/><a:lstStyle/>' + paras + '</p:txBody></p:sp>';
}
function pptSlide(shapes) {
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
    'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:spTree>' +
    '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>' +
    '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>' +
    shapes.join("") + '</p:spTree></p:cSld><p:clrMapOvr><a:overrideClrMapping bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/></p:clrMapOvr></p:sld>';
}

function buildPptx() {
  const M = exportModel();
  const W = 12192000, H = 6858000;          /* 16:9 */
  const PAD = 640000;
  const CW = W - PAD * 2;
  const slides = [];

  /* title */
  slides.push(pptSlide([
    pptText(0, 0, W, 1500000, [{ text: "", size: 100 }], { fill: "203864" }),
    pptText(PAD, 420000, CW, 700000, [{ text: M.title, size: 3600, bold: true, color: "FFFFFF", align: "ctr" }]),
    pptText(PAD, 1150000, CW, 420000, [{ text: t("appSub") + " · " + M.period, size: 1800, color: "FFFFFF", align: "ctr" }]),
    pptText(PAD, 2600000, CW, 500000, [{ text: t("totalKpis") + ": " + M.list.length, size: 2000, bold: true, align: "ctr" }]),
    pptText(PAD, 3200000, CW, 400000, [
      { text: t("stAchieved") + ": " + M.counts.achieved + "   ·   " + t("stBelow") + ": " + M.counts.below +
              "   ·   " + t("stNot") + ": " + M.counts.not + "   ·   " + t("stAnnual") + ": " + M.counts.annual, size: 1500, align: "ctr" }]),
    pptText(PAD, 5600000, CW, 400000, [
      { text: t("generatedOn") + ": " + M.on + "   ·   " + t("generatedBy") + ": " + M.by, size: 1200, color: "7D89A6", align: "ctr" }])
  ]));

  /* objectives with weights */
  const objShapes = [pptText(PAD, 300000, CW, 500000, [{ text: t("navObjectives"), size: 2600, bold: true }])];
  M.objectives.forEach((o, i) => {
    const own = M.list.filter(k => k.objective === o.id);
    const ach = own.filter(k => statusOf(k) === "achieved").length;
    const y = 1100000 + i * 1150000;
    objShapes.push(pptText(PAD, y, CW, 950000, [
      { text: o.code + " · " + L(o), size: 1600, bold: true },
      { text: t("weight") + ": " + (+o.weight || 0) + "%   ·   " + t("kpiCount") + ": " + own.length +
              "   ·   " + t("stAchieved") + ": " + ach, size: 1200, color: "4B5875" }
    ], { fill: i % 2 ? "F7F9FD" : "EEF2FA" }));
  });
  slides.push(pptSlide(objShapes));

  /* status by sector */
  const secShapes = [pptText(PAD, 300000, CW, 500000, [{ text: t("bySector"), size: 2600, bold: true }])];
  const secs = M.sectors.map(s => ({ s: s, own: M.list.filter(k => k.sector === s.id) })).filter(x => x.own.length);
  secs.slice(0, 12).forEach((x, i) => {
    const ach = x.own.filter(k => statusOf(k) === "achieved").length;
    const y = 1050000 + i * 420000;
    secShapes.push(pptText(PAD, y, CW * 0.62, 380000, [{ text: L(x.s), size: 1200 }]));
    secShapes.push(pptText(PAD + CW * 0.64, y, CW * 0.34, 380000, [
      { text: ach + " / " + x.own.length + "  (" + Math.round(ach / x.own.length * 100) + "%)", size: 1200, bold: true, align: "ctr" }],
      { fill: ach / x.own.length >= 0.85 ? "DCFCE7" : ach / x.own.length >= 0.7 ? "FEF3C7" : "FFE4E6" }));
  });
  slides.push(pptSlide(secShapes));

  /* KPIs needing attention */
  const bad = M.list.filter(k => statusOf(k) === "not");
  const badShapes = [pptText(PAD, 300000, CW, 500000, [{ text: t("atRisk") + " (" + bad.length + ")", size: 2600, bold: true }])];
  bad.slice(0, 10).forEach((k, i) => {
    const y = 1050000 + i * 480000;
    badShapes.push(pptText(PAD, y, CW, 440000, [
      { text: L(k), size: 1200, bold: true },
      { text: (k.sector ? secName(k.sector) + "  ·  " : "") + t("fAch") + ": " + pct(achievement(k)) +
              "  ·  " + t(STATUS_META[statusOf(k)].key), size: 1000, color: "4B5875" }
    ], { fill: statusOf(k) === "not" ? "FFE4E6" : "FEF3C7" }));
  });
  slides.push(pptSlide(badShapes));

  /* tasks */
  const tDone = M.tasks.filter(x => x.status === "done").length;
  const tLate = M.tasks.filter(x => isLate(x)).length;
  const taskShapes = [
    pptText(PAD, 300000, CW, 500000, [{ text: t("navTasks"), size: 2600, bold: true }]),
    pptText(PAD, 1000000, CW, 480000, [
      { text: t("tasksTotal") + ": " + M.tasks.length + "   ·   " + t("tDone") + ": " + tDone +
              "   ·   " + t("tProgress") + ": " + (M.tasks.length - tDone - tLate) + "   ·   " + t("tasksLate") + ": " + tLate, size: 1400, bold: true, align: "ctr" }],
      { fill: "EEF2FA" })
  ];
  M.tasks.filter(x => x.status !== "done").slice(0, 8).forEach((x, i) => {
    taskShapes.push(pptText(PAD, 1750000 + i * 460000, CW, 420000, [
      { text: L(x), size: 1150, bold: true },
      { text: x.month + "  ·  " + (x.end || t("noDue")) + "  ·  " + t(TASK_META[effStatus(x)].key), size: 1000, color: "4B5875" }
    ], { fill: i % 2 ? "F7F9FD" : "FFFFFF" }));
  });
  slides.push(pptSlide(taskShapes));

  const N = slides.length;
  const files = [
    { name: "[Content_Types].xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>' +
      '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>' +
      '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>' +
      '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
      slides.map((s, i) => '<Override PartName="/ppt/slides/slide' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>').join("") +
      '</Types>' },
    { name: "_rels/.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>' },
    { name: "ppt/presentation.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"' + (LANG === "ar" ? ' rtl="1"' : "") + '>' +
      '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rIdM"/></p:sldMasterIdLst>' +
      '<p:sldIdLst>' + slides.map((s, i) => '<p:sldId id="' + (256 + i) + '" r:id="rId' + (i + 1) + '"/>').join("") + '</p:sldIdLst>' +
      '<p:sldSz cx="' + W + '" cy="' + H + '"/><p:notesSz cx="' + H + '" cy="' + W + '"/></p:presentation>' },
    { name: "ppt/_rels/presentation.xml.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      slides.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide' + (i + 1) + '.xml"/>').join("") +
      '<Relationship Id="rIdM" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>' +
      '<Relationship Id="rIdT" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/></Relationships>' },
    { name: "ppt/slideMasters/slideMaster1.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:spTree>' +
      '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>' +
      '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>' +
      '</p:spTree></p:cSld><p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/>' +
      '<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst></p:sldMaster>' },
    { name: "ppt/slideMasters/_rels/slideMaster1.xml.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/></Relationships>' },
    { name: "ppt/slideLayouts/slideLayout1.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
      'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" type="blank"><p:cSld name="Blank"><p:spTree>' +
      '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>' +

      '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>' },
    { name: "ppt/slideLayouts/_rels/slideLayout1.xml.rels", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/></Relationships>' },
    { name: "ppt/theme/theme1.xml", data: pptTheme() }

  slides.forEach((s, i) => {

  return Zip.build(files);

  w.document.write('<!DOCTYPE html><html lang="' + (LANG === "ar" ? "ar" : "en") + '" dir="' + (LANG === "ar" ? "rtl" : "ltr") + '"><head><meta charset="utf-8">' +

    '.kp b{display:block;font-size:19px;margin-top:3px}.kp span{font-size:10px;color:#7D89A6}' +
    'h2{font-size:13px;margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid #E7EBF3}' +
    'table{width:100%;border-collapse:collapse;font-size:9.5px}' +
    'th{background:#203864;color:#fff;padding:6px;text-align:start;font-weight:600}' +
    'td{padding:5px 6px;border-bottom:1px solid #E7EBF3;vertical-align:middle}' +

    'thead{display:table-header-group}tr{break-inside:avoid}' +
    '</style></head><body>' +

function collectKpi(k) {
  $$("[data-k]").forEach(el => { k[el.dataset.k] = el.value; });
  const boxes = $$("[data-owner]");
  if (boxes.length) k.owners = boxes.filter(b => b.checked).map(b => b.dataset.owner);
}
async function saveKpi(k) {
  if (!requireAdmin()) return;
  const before = JSON.parse(JSON.stringify(k));
  collectKpi(k);
  if (!k.ar && !k.en) { toast(t("fName") + " — " + t("noData"), "err"); return; }
  const valueFields = ["q1t", "q1a", "q2t", "q2a", "q3t", "q3a", "q4t", "q4a", "annualTarget", "polarity", "basis"];
  if (k.statusOverride && before.statusOverride === k.statusOverride &&
      valueFields.some(f => String(before[f] ?? "") !== String(k[f] ?? ""))) {
    logAudit("edit", L(k), t("fStatus"), t(STATUS_META[k.statusOverride].key), t("fromThresholds"));
    k.statusOverride = "";   /* edited numbers hand control back to the threshold matrix */
  }
  k.updatedAt = new Date().toISOString(); k.updatedBy = DB.currentUser;
  const wasNew = k.isNew; delete k.isNew;
  if (wasNew) logAudit("add", L(k), t("fName"), "", L(k));
  else Object.keys(k).forEach(f => {
    if (["updatedAt", "updatedBy", "attachments", "owners", "id", "order"].includes(f)) return;
    if (String(before[f] ?? "") !== String(k[f] ?? "")) logAudit("edit", L(k), fieldLabel(f), before[f], k[f]);
  });
  await persist(); closeModal(); toast(t("savedOk"), "ok"); render();
}
function fieldLabel(f) {
  const M = { ar: "fNameAr", en: "fNameEn", definition: "fDef", objective: "fObjective", category: "fCategory", sector: "fSector", organization: "fOrg", frequency: "fFreq", polarity: "fPolarity", unit: "fUnit", baseline: "fBaseline", annualTarget: "fAnnualTarget", q1t: "fQ1T", q1a: "fQ1A", q2t: "fQ2T", q2a: "fQ2A", q3t: "fQ3T", q3a: "fQ3A", q4t: "fQ4T", q4a: "fQ4A", achOverride: "fAch", formula: "fFormula", dataSource: "fSource", challenges: "fChallenges", actions: "fActions", notes: "fNotes" };
  return M[f] ? t(M[f]) : f;
}
function handleFiles(k, files) {
  if (!requireAdmin()) return;
  Array.from(files).forEach(f => {
    if (f.size > 4.5 * 1024 * 1024) { toast(f.name + " > 4.5MB", "err"); return; }
    const r = new FileReader();
    r.onload = async () => {
      k.attachments = k.attachments || [];
      k.attachments.push({ name: f.name, size: f.size, data: r.result, by: L(currentUser()), at: new Date().toISOString() });
      await commit("upload", L(k), t("fAttach"), "", f.name);
      drawKpiModal(); toast(t("savedOk"), "ok");
    };
    r.readAsDataURL(f);
  });
}

function editEntity(kind, id) {
  if (!requireAdmin()) return;
  const coll = { obj: DB.objectives, org: DB.organizations, sec: DB.sectors, user: DB.users, cat: DB.categories }[kind];
  const isNew = !id;
  let x = isNew ? { id: uid(kind), ar: "", en: "", order: coll.length + 1 } : byId(coll, id);
  if (isNew) {
    if (kind === "obj") { x.code = "O" + (coll.length + 1); x.desc = ""; x.color = "#203864"; }
    if (kind === "org") x.short = "";
    if (kind === "user") { x.role = "admin"; x.titleAr = ""; x.titleEn = ""; x.showTitle = false; x.sector = ""; }
    if (kind === "cat") { x.icon = "\u25c7"; x.kind = "table"; x.excluded = true; x.subAr = ""; x.subEn = ""; }
  }
  const before = JSON.parse(JSON.stringify(x));
  const titles = { obj: t("navObjectives"), org: t("navOrgs"), sec: t("navSectors"), user: t("navUsers"), cat: t("navCats") };
  let extra = "";
  if (kind === "obj") extra = '<div class="fld"><label>' + esc(LANG === "ar" ? "الرمز" : "Code") + '</label><input data-e="code" value="' + esc(x.code || "") + '"></div>' +

   ============================================================ */
function enableDnD(container, itemSel, idAttr, onDrop) {
  const host = $(container); if (!host) return;
  let dragged = null;
  host.querySelectorAll(itemSel).forEach(el => {
    el.addEventListener("dragstart", e => { dragged = el; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", el.dataset[idAttr]); } catch (x) {} });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); host.querySelectorAll(".drop-target").forEach(d => d.classList.remove("drop-target")); });
    el.addEventListener("dragover", e => { e.preventDefault(); if (el !== dragged) el.classList.add("drop-target"); });
    el.addEventListener("dragleave", () => el.classList.remove("drop-target"));
    el.addEventListener("drop", e => {
      e.preventDefault(); el.classList.remove("drop-target");
      if (!dragged || dragged === el) return;
      onDrop(dragged.dataset[idAttr], el.dataset[idAttr]);
    });
  });
}
async function reorder(coll, fromId, toId, label) {
  const a = byId(coll, fromId), b = byId(coll, toId); if (!a || !b) return;
  const sorted = coll.slice().sort((x, y) => (x.order || 0) - (y.order || 0));
  const fi = sorted.indexOf(a), ti = sorted.indexOf(b);
  sorted.splice(fi, 1); sorted.splice(ti, 0, a);
  sorted.forEach((x, i) => x.order = i + 1);
  await commit("edit", label, LANG === "ar" ? "الترتيب" : "Order", fi + 1, ti + 1);
  render();
}
function wireDnD() {
  if (!canEdit()) return;
  if (VIEW.page === "kpis") enableDnD("#kpiGrid", ".kpi", "kpi", (f, tt) => reorder(DB.kpis, f, tt, t("navPerf")));
  if (VIEW.page === "objectives") enableDnD("#objList", ".obj", "obj", (f, tt) => reorder(DB.objectives, f, tt, t("navObjectives")));
  if (VIEW.page === "tasks") {
    enableDnD("#taskList", ".rowitem", "task", (f, tt) => reorder(DB.tasks, f, tt, t("navTasks")));
    wireKanban();
  }
  ["org", "sec"].forEach(kind => {
    const coll = kind === "org" ? DB.organizations : DB.sectors;
    /* Sectors are cards now, organizations are still rows. */
    const sel = kind === "org" ? ".rowitem" : ".seccard";
    enableDnD('[data-list="' + kind + '"]', sel, "id", (f, tt) => reorder(coll, f, tt, kind === "org" ? t("navOrgs") : t("navSectors")));
  });
}

/* Kanban columns accept cards; dropping one rewrites its status. */
function wireKanban() {
  const host = $("#kanban"); if (!host) return;
  let dragged = null;
  host.querySelectorAll(".tcard").forEach(el => {
    el.addEventListener("dragstart", e => { dragged = el; el.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); host.querySelectorAll(".over").forEach(c => c.classList.remove("over")); });
  });
  host.querySelectorAll(".kcol").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", async e => {
      e.preventDefault(); col.classList.remove("over");
      if (!dragged) return;
      const x = byId(DB.tasks, dragged.dataset.task); if (!x) return;
      const target = col.dataset.kcol;
      const old = effStatus(x);
      if (old === target) return;
      if (target === "late") {
        /* Keep whatever work state the task was in, and mark it late explicitly. */
        if (x.status === "done") { x.status = "progress"; x.progress = Math.min(99, +x.progress || 50); }
        x.lateFlag = true;
      } else {
        x.lateFlag = false;
        x.status = target;
        if (target === "done") x.progress = 100;
        else if (target === "progress" && (+x.progress || 0) === 0) x.progress = 25;
        else if (target === "planned") x.progress = 0;
      }
      await commit("edit", t("navTasks") + " · " + L(x), t("fStatus"), t(TASK_META[old].key), t(TASK_META[target].key));
      render();
    });
  });
}

function download(name, content, mime) {
  const blob = new Blob(["\ufeff" + content], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportCsv() {
  const cols = [["fName", k => L(k)], ["fCategory", k => catName(k.category)], ["fObjective", k => objName(k.objective)],
  ["fSector", k => secName(k.sector)], ["fOrg", k => orgName(k.organization)], ["fOwner", k => (k.owners || []).map(userName).join(" / ")],
  ["fPolarity", k => k.polarity], ["fFreq", k => k.frequency], ["fBaseline", k => k.baseline], ["fAnnualTarget", k => k.annualTarget],
  ["fQ1T", k => k.q1t], ["fQ1A", k => k.q1a], ["fQ2T", k => k.q2t], ["fQ2A", k => k.q2a],
  ["fQ3T", k => k.q3t], ["fQ3A", k => k.q3a], ["fQ4T", k => k.q4t], ["fQ4A", k => k.q4a],
  ["fAch", k => achievement(k) === null ? "" : achievement(k).toFixed(1)], ["fStatus", k => t(STATUS_META[statusOf(k)].key)]];
  const q = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const rows = [cols.map(c => q(t(c[0]))).join(",")].concat(filtered().map(k => cols.map(c => q(c[1](k))).join(",")));
  download("sme_bank_kpis_" + new Date().toISOString().slice(0, 10) + ".csv", rows.join("\n"), "text/csv;charset=utf-8");
}
function exportAuditCsv() {

  const rows = DB.audit.map(a => [a.userName, a.date, a.time, t({ add: "aAdd", edit: "aEdit", delete: "aDelete", restore: "aRestore", upload: "aUpload", import: "aImport", settings: "aSettings" }[a.action] || a.action), a.entity + (a.field ? " · " + a.field : ""), a.oldV, a.newV].map(q).join(","));

}
function shareDialog() {

    }

      url + "\n\nوتفضلوا بقبول فائق الاحترام،\nإدارة الأداء المؤسسي\nبنك المنشآت الصغيرة والمتوسطة";

  const editors = DB.users.filter(u => u.role === "editor").sort((a, b) => a.order - b.order);

  const banner = isFile

    '<div class="fld mt"><label>' + esc(t("shareKind")) + '</label><select id="shKind">' +
    '<option value="viewer">' + esc(t("shareViewer")) + '</option>' +
    '<option value="editor">' + esc(t("shareEditor")) + '</option>' +
    '<option value="user">' + esc(t("shareUser")) + '</option></select></div>' +
    '<div class="fld" id="shPickWrap" style="display:none"><label>' + esc(t("sharePick")) + '</label>' +
    '<select id="shPick"></select></div>' +
    '<div class="fld"><label>' + esc(t("shareLink")) + '</label>' +
    '<input id="shareUrl" dir="ltr" readonly></div>' +

function loadImportText(text) {
  if (!text || !text.trim()) { toast(t("noData"), "err"); return; }
  if (text.trim().charAt(0) === "{" || text.trim().charAt(0) === "[") {
    try {
      const j = JSON.parse(text);
      if (j.kpis && j.version) { DB = Object.assign(SEED(), j); LANG = DB.settings.lang || "ar"; persist(); toast(t("importDone"), "ok"); VIEW.page = "overview"; render(); return; }
      const arr = Array.isArray(j) ? j : (j.kpis || []);
      IMPORT_STATE.headers = Object.keys(arr[0] || {});
      IMPORT_STATE.rows = arr.map(o => IMPORT_STATE.headers.map(h => o[h]));
    } catch (e) { toast("JSON — " + t("noData"), "err"); return; }
  } else {
    const grid = parseDelimited(text);
    if (grid.length < 2) { toast(t("noData"), "err"); return; }
    IMPORT_STATE.headers = grid[0].map(h => String(h).trim());
    IMPORT_STATE.rows = grid.slice(1).filter(r => r.some(c => String(c).trim() !== ""));
  }
  IMPORT_STATE.map = autoMap(IMPORT_STATE.headers);
  const ri = $("#rowInfo"); if (ri) ri.textContent = IMPORT_STATE.rows.length + " " + t("rowsFound");
  renderMapArea();
}

document.addEventListener("click", e => {
  const act = e.target.closest("[data-act]"); if (!act) return;
  const kEl = act.closest("[data-kpi]");
  if (kEl) {
    const id = kEl.dataset.kpi;
    if (act.dataset.act === "open" || act.dataset.act === "edit") { openKpi(id); return; }
    if (act.dataset.act === "del") {
      if (!requireAdmin()) return;
      const k = byId(DB.kpis, id);
      confirmDialog(t("confirmDelete"), async () => {
        DB.trash.push(JSON.parse(JSON.stringify(k)));
        DB.kpis = DB.kpis.filter(x => x.id !== id);
        await commit("delete", L(k), t("fName"), L(k), ""); toast(t("deletedOk")); render();
      });
      return;
    }
  }
  const r = act.dataset.r; if (!r) return;
  const id = act.dataset.id;
  if (r === "task") { act.dataset.act === "del" ? deleteTask(id) : editTask(id); return; }
  if (r === "card") { act.dataset.act === "del" ? deleteCard(id) : editCard(id); return; }
  if (r === "method") { editMethod(id); return; }
  if (act.dataset.act === "edit") editEntity(r, id);
  else if (act.dataset.act === "del") deleteEntity(r, id);
  else if (act.dataset.act === "assign") assignKpis(id);
  else if (act.dataset.act === "switch") { DB.currentUser = id; commit("login", L(currentUser()), "", "", L(currentUser())); render(); toast(L(currentUser()), "ok"); }
});

(async function init() {
  await Store.detect();
  const saved = await Store.load();
  /* Only widgets the current build knows about survive; retired ones are dropped. */
  const mergeSections = old => {
    const fresh = SEED().settings.sections, out = {};
    Object.keys(fresh).forEach(k => { out[k] = (old && k in old) ? !!old[k] : fresh[k]; });
    return out;
  };
  if (saved && saved.version === DATA_VERSION) {
    DB = Object.assign(SEED(), saved);
    DB.settings.sections = mergeSections((saved.settings || {}).sections);
    /* State saved before section types existed has no kind on its categories.
       Restore the built-in ones so Impact and SVC keep their card layouts. */
    const BUILTIN = { cat_impact: { kind: "display_table", group: "impact" }, cat_svc: { kind: "display_cards", group: "svc" } };
    (DB.categories || []).forEach(c => {
      if (BUILTIN[c.id]) { c.kind = BUILTIN[c.id].kind; c.group = BUILTIN[c.id].group; c.excluded = false; }
      else if (!c.kind) { c.kind = "table"; }
    });
  } else if (saved && saved.version) {
    /* An earlier build is cached in this browser. Adopt the current report data
       and carry the user's own settings, people and audit trail across. */
    DB = SEED();
    DB.settings = Object.assign(DB.settings, saved.settings || {});
    DB.settings.sections = mergeSections((saved.settings || {}).sections);
    DB.audit = saved.audit || [];
    DB.submissions = saved.submissions || [];
    DB.currentUser = saved.currentUser || DB.currentUser;
    if (saved.receipt) {                       /* keep quarterly submissions already recorded */
      ["q1", "q2", "q3", "q4"].forEach(q => {
        (saved.receipt[q] || []).forEach(old => {
          const r = (DB.receipt[q] || []).find(x => x.sector === old.sector);
          if (r) { r.state = old.state || r.state; r.note = old.note !== undefined ? old.note : r.note; }
        });
      });
    }
    if ((saved.users || []).length) {          /* keep their people, never lose a seeded one */
      const seeded = DB.users.slice();
      DB.users = saved.users.slice();
      seeded.forEach(su => { if (!DB.users.some(u => u.id === su.id)) DB.users.push(su); });
    }
    logAudit("import", t("appName"), t("navData"), "v" + saved.version, "v" + DATA_VERSION);
    await persist();
  }
  /* Identity refresh: browsers that cached the previous palette are moved onto
     the bank colours. Anything the user picked themselves is left untouched. */
  const LEGACY_COLOR = {
    "#00C2FF": "#54C1C8", "#4B3FF7": "#203864",
    "#17B7F0": "#54C1C8", "#E07B00": "#A8A3C9", "#A020F0": "#7F7F7F"
  };
  const rebrand = v => LEGACY_COLOR[String(v || "").toUpperCase()] || v;
  DB.settings.accentA = rebrand(DB.settings.accentA);
  DB.settings.accentB = rebrand(DB.settings.accentB);
  (DB.objectives || []).forEach(o => { o.color = rebrand(o.color); });

  LANG = (DB.settings && DB.settings.lang) || "ar";
  syncLabels();

  /* On Microsoft 365 the signed-in account decides the role: matched by e-mail to a
     dashboard user, and anyone not listed gets read-only access automatically. */
  const who = await Store.whoAmI();
  if (who) {
    const match = DB.users.find(u => (u.email || "").toLowerCase() === who.email && who.email);
    if (match) DB.currentUser = match.id;
    else {
      let guest = DB.users.find(u => u.id === "u_m365guest");
      if (!guest) {
        guest = { id: "u_m365guest", ar: who.name || "\u0645\u0648\u0638\u0641", en: who.name || "Employee",
          titleAr: "", titleEn: "", showTitle: false, role: "viewer", email: who.email, order: 98 };
        DB.users.push(guest);
      } else { guest.ar = who.name || guest.ar; guest.en = who.name || guest.en; guest.email = who.email; }
      DB.currentUser = guest.id;
    }
  }
  /* Invitation links: ?as=<userId> opens the dashboard as that user, and
     &sector=<id> pins a sector representative to their own sector. On
     SharePoint the Microsoft 365 identity above always wins, so the link is a
     convenience there and the only identity signal when running standalone. */
  const P = new URLSearchParams(location.search);
  const asId = P.get("as");
  if (asId && !Store.shared()) {
    const target = DB.users.find(u => u.id === asId);
    if (target) {
      DB.currentUser = target.id;
      const sec = P.get("sector");
      if (sec && target.role === "editor" && byId(DB.sectors, sec)) target.sector = sec;
    }
  }
  if (FORCE_VIEWONLY) { const v = DB.users.find(u => u.role === "viewer"); if (v) DB.currentUser = v.id; }
  render();
  if (!DB.audit.length) { logAudit("login", L(currentUser()), "", "", L(currentUser())); await persist(); }
})();
</script>
</body>
</html>
