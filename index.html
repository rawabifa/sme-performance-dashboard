<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة الأداء — بنك المنشآت</title>
<style>
/* ------------------------------------------------------------------
   Corporate typeface — theSansArabic Plain.
   Loaded from the machine first (local()), then from a font file placed
   next to this dashboard, e.g.  ./fonts/theSansArabic-Plain.woff2
   ------------------------------------------------------------------ */
@font-face{
  font-family:"theSansArabic-Plain";
  src:local("theSansArabic Plain"), local("theSansArabic-Plain"),
      local("TheSansArabic Plain"), local("The Sans Arabic Plain"),
      local("TheSansArabic-Plain"),
      url("fonts/theSansArabic-Plain.woff2") format("woff2"),
      url("fonts/theSansArabic-Plain.woff")  format("woff"),
      url("fonts/theSansArabic-Plain.ttf")   format("truetype"),
      url("theSansArabic-Plain.ttf")         format("truetype");
  font-weight:100 900; font-style:normal; font-display:swap;
}
:root{
  /* Bank identity palette — العميل والمستفيد #203864 · العمليات الداخلية #54C1C8
     · المالي #A8A3C9 · التعلم والنمو #7F7F7F */
  --brand-navy:#203864; --brand-teal:#54C1C8; --brand-lilac:#A8A3C9; --brand-grey:#7F7F7F;
  --navy-900:#13233F; --navy-800:#1A2C51; --navy-700:#203864; --navy-600:#2A4879;
  --navy-500:#35578F; --nav-item:#2A4879; --nav-item-hover:#35578F;
  --accent-a:#54C1C8; --accent-b:#203864; --accent-c:#A8A3C9;
  --grad:linear-gradient(90deg,#54C1C8 0%,#203864 100%);
  --grad-rtl:linear-gradient(270deg,#54C1C8 0%,#203864 100%);
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#E9A400; --warn-soft:#FEF3C7;
  --bad:#E11D48; --bad-soft:#FFE4E6; --na:#94A3B8; --na-soft:#EEF2F6;
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#FAFBFD; --line:#E6EAF1;
  --ink:#1B2B47; --ink-2:#4C5A73; --ink-3:#7C889D;
  --shadow:0 1px 2px rgba(32,56,100,.05),0 8px 24px rgba(32,56,100,.07);
  --shadow-lg:0 18px 50px rgba(32,56,100,.18);
  --r:14px; --r-sm:10px; --sidebar-w:270px;
  --o1:#203864; --o2:#54C1C8; --o3:#A8A3C9; --o4:#7F7F7F; --o0:#16A34A;
  --font:"theSansArabic-Plain","theSansArabic","The Sans Arabic","Segoe UI","Dubai","Tahoma","Noto Kufi Arabic",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0A1526; --surface:#132239; --surface-2:#0F1B2E; --line:#22375A;
  --ink:#EAF0F8; --ink-2:#A7B6CC; --ink-3:#7C8BA3;
  --navy-900:#07101F; --navy-800:#0D1A2E; --nav-item:#1A2C4B; --nav-item-hover:#264267;
  --ok-soft:#0C3D24; --warn-soft:#453107; --bad-soft:#4A1024; --na-soft:#1B2547;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent-b);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C3CCE0;border-radius:9px}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2B3A6B}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Enhancements: quarterly receipt controls, label editor ---------- */
select.rcsel,input.rcnote{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink);font-size:12.5px;transition:border-color .15s,box-shadow .15s}
select.rcsel:focus,input.rcnote:focus,input[data-lbl]:focus{outline:none;border-color:var(--accent-b);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-b) 18%,transparent)}
input[data-lbl]{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
input[data-lbl]:not([value=""]){border-color:var(--accent-b)}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.kcol.over{outline:2px dashed var(--accent-b);outline-offset:-4px;background:var(--surface-2)}
.tcard.dragging{opacity:.45;transform:scale(.98)}
.tcard{transition:transform .14s,box-shadow .14s,opacity .14s}
.tcard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.card.section{animation:riseIn .26s ease both}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.sectorrep .edit-h .iconbtn{opacity:1}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#fff;padding:16px 14px 26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 16px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.brand-t{font-weight:700;font-size:14.5px;line-height:1.35}
.brand-s{font-size:11px;color:#9BAAD8;margin-top:2px}
.nav-label{font-size:10.5px;letter-spacing:.09em;color:#8E9DD0;margin:16px 8px 8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:11px;color:#DCE4FA;font-size:13.5px;margin-bottom:5px;transition:background .16s,transform .16s;text-align:start}
.nav-item:hover{background:var(--nav-item-hover)}
.nav-item.active{background:var(--nav-item);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav-item .ic{width:18px;text-align:center;flex:0 0 18px}
.nav-item .cnt{margin-inline-start:auto;font-size:11px;background:rgba(255,255,255,.13);padding:1px 7px;border-radius:20px}
.nav-group{border-radius:11px;overflow:hidden;margin-bottom:6px}
.nav-toggle{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;color:#fff;font-weight:600;font-size:13.5px;background:var(--nav-item);border-radius:11px}
.nav-toggle .chev{margin-inline-start:auto;transition:transform .2s}
.nav-group.open .chev{transform:rotate(180deg)}
.nav-sub{display:none;padding:6px 0 2px}
.nav-group.open .nav-sub{display:block;animation:slide .18s ease}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.nav-sub .nav-item{padding-inline-start:26px;font-size:13px}

/* ---------- Topbar ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.page-title{font-size:17px;font-weight:700;margin:0}
.page-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.spacer{margin-inline-start:auto}
.search{position:relative}
.search input{width:230px;padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
html[dir="ltr"] .search input{padding:8px 12px 8px 34px}
.search .si{position:absolute;inset-inline-end:11px;top:8px;color:var(--ink-3)}
.tbtn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.tbtn:hover{border-color:var(--accent-b);color:var(--accent-b)}
.tbtn.primary{background:var(--grad);color:#fff;border:0}
.tbtn.primary:hover{filter:brightness(1.08);color:#fff}
.tbtn.danger{color:var(--bad);border-color:var(--bad)}
.tbtn.on{background:var(--accent-b);color:#fff;border-color:var(--accent-b)}
.who{display:flex;align-items:center;gap:9px;padding:5px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.who-n{font-size:12.5px;font-weight:600;line-height:1.2}
.who-r{font-size:10.5px;color:var(--ink-3)}
.content{padding:20px 22px 60px;flex:1}

/* ---------- Cards & grid ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-t{font-weight:700;font-size:14px}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g12{grid-template-columns:2fr 1fr}
@media(max-width:1480px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1250px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g12,.g3{grid-template-columns:1fr}}
@media(max-width:760px){.g4,.g5,.g2{grid-template-columns:1fr}}
.section{margin-bottom:18px}
.section-h{display:flex;align-items:center;gap:10px;margin:0 2px 11px}
.section-t{font-size:15px;font-weight:700}
.muted{color:var(--ink-3);font-size:12px}

/* ---------- Stat cards ---------- */
.stat{padding:15px 16px;position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--ink-2)}
.stat .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stat .bar{height:6px;border-radius:6px;background:var(--na-soft);margin-top:11px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:6px;background:var(--grad-rtl);transition:width .7s cubic-bezier(.2,.8,.2,1)}
html[dir="ltr"] .stat .bar i{background:var(--grad)}
.stat .ring{position:absolute;inset-inline-end:-14px;top:-14px;width:76px;height:76px;border-radius:50%;background:var(--grad);opacity:.07}

/* ---------- Badges & pills ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-na{background:var(--na-soft);color:var(--na)}
.pill{font-size:11px;padding:2px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

/* ---------- KPI cards ---------- */
.kpi{padding:15px;display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi[draggable="true"]{cursor:grab}
.kpi .kx{display:flex;align-items:flex-start;gap:8px}
.kpi .kname{font-weight:700;font-size:13.5px;line-height:1.45;flex:1;cursor:pointer}
.kpi .kname:hover{color:var(--accent-b)}
.kpi .kmeta{display:flex;flex-wrap:wrap;gap:5px}
.kpi .kvals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.kpi .kv{text-align:center}
.kpi .kv b{display:block;font-size:14.5px;font-weight:800}
.kpi .kv span{font-size:10.5px;color:var(--ink-3)}
.kpi .kbar{height:7px;border-radius:7px;background:var(--na-soft);overflow:hidden}
.kpi .kbar i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.kpi .edit-h{position:absolute;inset-inline-start:9px;top:9px;display:flex;gap:4px}
.iconbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--accent-b);color:var(--accent-b)}
.iconbtn.del:hover{border-color:var(--bad);color:var(--bad)}
.drop-target{outline:2px dashed var(--accent-b);outline-offset:3px;background:rgba(75,63,247,.05)}
.dragging{opacity:.4}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
table.tbl th{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;padding:10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl .num{font-variant-numeric:tabular-nums;font-weight:600}
.linkish{color:var(--accent-b);cursor:pointer;font-weight:600}
.linkish:hover{text-decoration:underline}

/* ---------- Filters ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f-item label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.f-item select,.f-item input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
@media(max-width:900px){.form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent-b);box-shadow:0 0 0 3px rgba(75,63,247,.13)}
.fld textarea{min-height:82px;resize:vertical}
.fld.wide{grid-column:1/-1}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:.6;cursor:not-allowed}
.calc{background:var(--na-soft);font-weight:700}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,17,45,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.overlay.open{display:flex;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:1000px;box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
.modal.sm{max-width:520px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:2}
.modal-t{font-weight:700;font-size:15.5px}
.modal-b{padding:18px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding:0 18px;flex-wrap:wrap;background:var(--surface)}
.tab{padding:9px 13px;font-size:12.5px;border-bottom:2px solid transparent;color:var(--ink-2);margin-bottom:-1px}
.tab.active{color:var(--accent-b);border-bottom-color:var(--accent-b);font-weight:700}

/* ---------- Charts ---------- */
.legend{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.legend i{width:16px;height:9px;border-radius:3px;display:inline-block}
.donut-c{position:relative;display:grid;place-items:center}
.donut-center{position:absolute;text-align:center}
.donut-center b{display:block;font-size:25px;font-weight:800}
.donut-center span{font-size:11px;color:var(--ink-3)}
.owner-row{margin-bottom:13px}
.owner-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.owner-n{font-weight:700;font-size:12.5px;color:var(--accent-b)}
.owner-v{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.owner-bar{height:8px;border-radius:8px;background:var(--na-soft);overflow:hidden}
.owner-bar i{display:block;height:100%;background:var(--grad-rtl);border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
html[dir="ltr"] .owner-bar i{background:var(--grad)}
.thr-legend{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;padding:6px 0}
.thr-item{text-align:center;min-width:130px}
.thr-item .ln{height:4px;border-radius:4px;margin:7px auto 0;width:78px}
.thr-item .tt{font-size:11.5px;font-weight:600}

/* ---------- Lists (admin) ---------- */
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);transition:.15s}
.rowitem:hover{border-color:var(--accent-b)}
.rowitem .handle{cursor:grab;color:var(--ink-3);font-size:14px}
.rowitem .rt{font-weight:600;font-size:13px}
.rowitem .rs{font-size:11px;color:var(--ink-3)}
.rowitem .ract{margin-inline-start:auto;display:flex;gap:5px}
.swatch{width:13px;height:13px;border-radius:4px;display:inline-block;vertical-align:-2px}

/* ---------- Toast ---------- */
.toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:300;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--navy-800);color:#fff;padding:11px 15px;border-radius:11px;font-size:12.5px;box-shadow:var(--shadow-lg);animation:tin .22s;max-width:340px;display:flex;gap:9px;align-items:center}
.toast.ok{background:var(--ok)} .toast.err{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:46px 20px}
.empty .ei{font-size:40px;opacity:.35}
.empty .et{font-weight:700;margin:12px 0 5px;font-size:15px}
.empty .es{color:var(--ink-3);font-size:12.5px;max-width:430px;margin:0 auto 16px;line-height:1.7}
.banner{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:12px;background:linear-gradient(90deg,rgba(0,194,255,.09),rgba(75,63,247,.09));border:1px solid rgba(75,63,247,.22);margin-bottom:16px;font-size:12.5px;line-height:1.65}
.banner b{display:block;margin-bottom:2px}

/* ---------- Attachments ---------- */
.att{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--surface-2)}
.att .fi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 auto}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-3);font-size:12.5px;transition:.15s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--accent-b);background:rgba(75,63,247,.04);color:var(--accent-b)}

/* ---------- Objectives ---------- */
.obj{padding:14px;border-inline-start:4px solid var(--accent-b);position:relative}
.obj .oc{font-size:10.5px;font-weight:800;color:#fff;background:var(--accent-b);padding:2px 8px;border-radius:6px;display:inline-block}
.obj .on{font-weight:700;font-size:13.5px;margin:8px 0 4px;line-height:1.5}
.obj .od{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.obj .ok-bar{height:6px;border-radius:6px;background:var(--na-soft);margin-top:11px;overflow:hidden}
.obj .ok-bar i{display:block;height:100%;border-radius:6px}

/* ---------- Responsive: off-canvas sidebar ---------- */
.menubtn{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,17,45,.45);z-index:45;display:none}
@media(max-width:980px){
  .menubtn{display:inline-flex}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:50;transform:translateX(var(--off,-100%));transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  html[dir="rtl"] .sidebar{--off:100%;inset-inline-start:auto;inset-inline-end:0}
  body.navopen .sidebar{transform:translateX(0)}
  body.navopen .scrim{display:block}
  .content{padding:14px 13px 50px}
  .topbar{padding:9px 13px;gap:8px}
  .page-title{font-size:15.5px}
  .search input{width:150px}
  .modal-b{padding:14px}
}

/* ============================================================
   1. PERSISTENCE LAYER
   Works in three environments, in order of preference:
   window.storage (Claude artifact host) -> localStorage (local file
   / web server) -> in-memory (sandboxed iframe with no storage).
   ============================================================ */
/* ------------------------------------------------------------
   DATA SOURCE CONFIGURATION  --  edit this block only
   ------------------------------------------------------------
   mode "auto"        pick the best available store automatically
   mode "sharepoint"  force the SharePoint list back end (Microsoft 365)
   mode "local"       force browser-local storage (single machine)

   To go live on SharePoint, set mode to "sharepoint" and fill in siteUrl.
   Nothing else in this file needs to change: every read and write in the
   dashboard goes through Store, so the user interface is untouched.
   ------------------------------------------------------------ */
const DATA_SOURCE = {
  mode: "auto",
  sharepoint: {
    siteUrl: "",                      /* e.g. "https://smebank.sharepoint.com/sites/CorporatePerformance" */
    list: "PerformanceDashboard",     /* custom list holding the dashboard state */
    key: "dashboard-state",           /* Title of the state row(s) */
    chunkSize: 180000,                /* characters per list item; state is split across rows */
    pollSeconds: 0                    /* >0 to re-read the list periodically for near-live updates */
  }
};

/* ============================================================
   1. PERSISTENCE LAYER
   Store is an adapter facade. Adapters implement load/save/wipe.
   Available adapters, in order of preference when mode is "auto":
     sharepoint  -> Microsoft 365 list, shared by every user (one live link)
     host        -> window.storage (Claude artifact host)
     local       -> localStorage (single browser)
     memory      -> in-memory only (sandboxed iframe, nothing persists)
   ============================================================ */
const KEY = "smebank_perf_dashboard_v1";

/* ---------- SharePoint REST adapter ---------- */
const SharePointAdapter = (() => {
  const C = DATA_SOURCE.sharepoint;
  const site = () => (C.siteUrl || location.origin + location.pathname.replace(/\/(SitePages|Shared%20Documents|Documents)\/.*$/i, "")).replace(/\/$/, "");
  const listApi = () => site() + "/_api/web/lists/getbytitle('" + encodeURIComponent(C.list) + "')";
  let digest = "", digestAt = 0, me = null;

  const json = async (url, opts) => {
    const r = await fetch(url, Object.assign({
      credentials: "same-origin",
      headers: Object.assign({ Accept: "application/json;odata=nometadata" }, (opts || {}).headers || {})
    }, opts || {}));
    if (!r.ok) throw new Error("SharePoint " + r.status + " " + r.statusText);
    return r.status === 204 ? null : r.json();
  };

  /* Write operations need a fresh form digest (valid ~30 minutes). */
  async function getDigest() {
    if (digest && Date.now() - digestAt < 20 * 60 * 1000) return digest;
    const d = await json(site() + "/_api/contextinfo", { method: "POST" });
    digest = d.FormDigestValue || (d.d && d.d.GetContextWebInformation.FormDigestValue);
    digestAt = Date.now();
    return digest;
  }

  async function detect() {
    try { await json(listApi() + "?$select=Title"); return true; } catch (e) { return false; }
  }

  /* Who is signed in, straight from Microsoft 365 -- no separate password. */
  async function currentUser() {
    if (me) return me;
    try {
      const u = await json(site() + "/_api/web/currentuser?$select=Title,Email,LoginName,Id");
      me = { name: u.Title || "", email: (u.Email || "").toLowerCase(), login: u.LoginName || "", id: u.Id };
    } catch (e) { me = null; }
    return me;
  }

  async function rows() {
    const r = await json(listApi() + "/items?$select=Id,Title,Seq,Payload&$filter=Title eq '" +
      encodeURIComponent(C.key) + "'&$orderby=Seq asc&$top=500");
    return (r.value || r.d && r.d.results || []);
  }

  async function load() {
    const rs = await rows();
    if (!rs.length) return null;
    const text = rs.map(x => x.Payload || "").join("");
    if (!text) return null;
    return JSON.parse(text);
  }

  async function save(obj) {
    const text = JSON.stringify(obj);
    const parts = [];
    for (let i = 0; i < text.length; i += C.chunkSize) parts.push(text.slice(i, i + C.chunkSize));
    const d = await getDigest();
    const H = {
      "X-RequestDigest": d,
      "Content-Type": "application/json;odata=nometadata",
      Accept: "application/json;odata=nometadata"
    };
    const existing = await rows();
    for (let i = 0; i < parts.length; i++) {
      const body = JSON.stringify({ Title: C.key, Seq: i, Payload: parts[i] });
      if (existing[i]) {
        await json(listApi() + "/items(" + existing[i].Id + ")", {
          method: "POST", body: body,
          headers: Object.assign({}, H, { "X-HTTP-Method": "MERGE", "If-Match": "*" })
        });
      } else {
        await json(listApi() + "/items", { method: "POST", body: body, headers: H });
      }
    }
    /* Drop any rows left over from a previously larger payload. */
    for (let i = parts.length; i < existing.length; i++) {
      await json(listApi() + "/items(" + existing[i].Id + ")", {
        method: "POST", headers: Object.assign({}, H, { "X-HTTP-Method": "DELETE", "If-Match": "*" })
      });
    }
    return true;
  }

  async function wipe() {
    const d = await getDigest();
    const existing = await rows();
    for (const r of existing) {
      await json(listApi() + "/items(" + r.Id + ")", {
        method: "POST",
        headers: { "X-RequestDigest": d, "X-HTTP-Method": "DELETE", "If-Match": "*", Accept: "application/json;odata=nometadata" }
      });
    }
  }

  return { detect, load, save, wipe, currentUser, name: "sharepoint" };
})();

const Store = (() => {
  let mode = "memory";
  const mem = {};

  async function detect() {
    if (DATA_SOURCE.mode === "local") { mode = tryLocal() ? "local" : "memory"; return; }
    if (DATA_SOURCE.mode === "sharepoint" || (DATA_SOURCE.mode === "auto" && DATA_SOURCE.sharepoint.siteUrl)) {
      if (await SharePointAdapter.detect()) { mode = "sharepoint"; return; }
      /* Fall through rather than leaving the dashboard blank if the list is unreachable. */
    }
    if (typeof window !== "undefined" && window.storage && window.storage.get) {
      try { await window.storage.list(""); mode = "host"; return; } catch (e) { mode = "host"; return; }
    }
    mode = tryLocal() ? "local" : "memory";
  }
  function tryLocal() {

const L = o => !o ? "" : (LANG === "ar" ? (o.ar || o.en || "") : (o.en || o.ar || ""));
const num = v => { if (v === "" || v === null || v === undefined) return null; const n = parseFloat(String(v).replace(/[,\s%٬]/g, "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))); return isNaN(n) ? null : n; };
const LOCALE = () => (LANG === "ar" ? "ar-SA-u-nu-latn" : "en-US");
const fmt = (v, d = 1) => {
  if (v === null || v === undefined || v === "") return "—";
  /* Small non-zero figures — a -0.01% return, for example — must not round away
     to "0" or, worse, "-0". Widen the precision until the value survives. */
  if (v !== 0 && Math.abs(v) < 0.5 / 10 ** d) {
    d = Math.min(6, Math.max(d, Math.ceil(-Math.log10(Math.abs(v))) + 1));
  }
  const n = Math.round(v * 10 ** d) / 10 ** d;
  return n.toLocaleString(LOCALE(), { maximumFractionDigits: d });
};
/* Large riyal figures read better as billions/millions, the way the report states them. */
const fmtC = v => {
  if (v === null || v === undefined || v === "") return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return fmt(v / 1e9, 2) + " " + (LANG === "ar" ? "مليار" : "bn");
  if (a >= 1e6) return fmt(v / 1e6, 2) + " " + (LANG === "ar" ? "مليون" : "m");
  return fmt(v);
};

/* ---------- Achievement engine (polarity-aware) ---------- */
function quarterPair(k, q) {
  if (q === "q1") return [num(k.q1t), num(k.q1a)];
  if (q === "q2") return [num(k.q2t), num(k.q2a)];
  if (q === "q3") return [num(k.q3t), num(k.q3a)];
  if (q === "q4") return [num(k.q4t), num(k.q4a)];
  const ts = [k.q1t, k.q2t, k.q3t, k.q4t].map(num).filter(v => v !== null);
  const as = [k.q1a, k.q2a, k.q3a, k.q4a].map(num).filter(v => v !== null);
  if (!as.length) return [null, null];
  /* Report charts carry running (year-to-date) values, so the YTD figure is the
     latest reported quarter, not the sum. KPIs captured as incremental use basis
     "sum". */
  if (k.basis === "sum") return [ts.reduce((a, b) => a + b, 0) || null, as.reduce((a, b) => a + b, 0)];
  let li = -1;
  ["q1a", "q2a", "q3a", "q4a"].forEach((f, i) => { if (num(k[f]) !== null) li = i; });
  const tg = num(k[["q1t", "q2t", "q3t", "q4t"][li]]);
  return [tg !== null ? tg : (ts.length ? ts[ts.length - 1] : null), as[as.length - 1]];
}

/* ------------------------------------------------------------------
   KPI CALCULATION ENGINE

   Polarity is a business attribute stored on the KPI ("positive" =
   higher is better, "negative" = lower is better). It is never inferred
   from the sign of a value: a loss-making ROE of -1.3% improving toward
   zero is a positive-polarity KPI whose numbers happen to be negative.

   Three quantities are kept apart on purpose:
     metTarget       signed comparison of actual against target
     rawAchievement  the mathematical percentage (may exceed 100 or go negative)
     displayProgress rawAchievement clamped to 0..100, for progress bars only
   ------------------------------------------------------------------ */

/* Annually-measured KPIs only. "نصف سنوي" (semi-annual) is measured at H1 and
   must NOT be caught here, even though the string contains "سنوي". */
function isAnnualKpi(k) {
  const f = String(k.frequency || "").trim().toLowerCase();
  if (!f) return false;
  if (f.indexOf("نصف") > -1 || f.indexOf("semi") > -1 || f.indexOf("half") > -1) return false;
  return f === "سنوي" || f.indexOf("annual") > -1 || f.indexOf("yearly") > -1;
}
/* The annual reading only exists once the year-end actual has been entered. */
function annualMeasured(k) { return num(k.q4a) !== null; }
function annualPending(k) { return isAnnualKpi(k) && !annualMeasured(k); }

/* Signed comparison. Math.abs is deliberately not used here — it would
   erase the financial meaning of a negative figure. */
function metTarget(k, tg, ac) {
  if (tg === null || ac === null) return false;
  return k.polarity === "negative" ? ac <= tg : ac >= tg;
}

function rawAchievement(k, tg, ac) {
  if (tg === null || ac === null) return null;
  const bl = num(k.baseline);
  const signed = tg < 0 || ac < 0 || (bl !== null && bl < 0);

  if (signed) {
    /* Distance travelled from the baseline toward the target. Works for
       negative figures, where a plain actual/target ratio is meaningless. */
    if (bl !== null && tg !== bl) return ((ac - bl) / (tg - bl)) * 100;
    /* No usable baseline (or target === baseline): fall back to the shortfall
       against the target, so a doubled loss reads as 0%, not 200%. */
    if (tg === 0) return metTarget(k, tg, ac) ? 100 : 0;
    const gap = k.polarity === "negative" ? (ac - tg) : (tg - ac);
    return (1 - gap / Math.abs(tg)) * 100;
  }

  /* Non-negative data keeps the ratio the dashboard has always used, so no
     existing KPI's percentage moves. */
  if (tg === 0 && ac === 0) return 100;
  if (k.polarity === "negative") {
    if (ac === 0) return tg === 0 ? 100 : 200;
    return (tg / ac) * 100;
  }
  if (tg === 0) return ac > 0 ? 100 : null;
  return (ac / tg) * 100;
}

/* Difference in the KPI's own units. For a percentage KPI this is a gap in
   percentage points, not a growth rate. */
function variance(k, q) {
  const [tg, ac] = quarterPair(k, q || FILTERS.quarter || "ytd");
  if (tg === null || ac === null) return null;
  return ac - tg;
}
function isPercentKpi(k) { return /%|نسبة|percent/i.test(String(k.unit || "") + " " + String(k.ar || "")); }
function fmtVariance(k, q) {
  const v = variance(k, q);
  if (v === null || isNaN(v)) return null;
  const n = (v > 0 ? "+" : "") + (Math.abs(v) < 100 ? v.toFixed(2).replace(/\.?0+$/, "") : fmtC(v));
  return isPercentKpi(k) ? n + " " + t("ppShort") : n;
}

function achievement(k, q) {
  q = q || FILTERS.quarter || "ytd";
  if (k.notMeasured) return null;
  if (k.achOverride !== undefined && k.achOverride !== null && k.achOverride !== "") return num(k.achOverride);
  /* An annual KPI has nothing to measure against until year-end, so interim
     quarters report 0% rather than a percentage built on a partial figure. */
  if (annualPending(k)) return 0;
  const [tg, ac] = quarterPair(k, q);
  if (tg === null || ac === null) return null;
  const r = rawAchievement(k, tg, ac);
  return r === null || isNaN(r) ? null : r;
}

/* Evaluate an arbitrary target/actual pair through the same engine the status,
   achievement percentage and RAG colour use. The quarterly timeline calls this
   instead of computing its own ratio, so a KPI can never read "Achieved" at the
   top and "under target" at the bottom. */
function evalPair(k, tg, ac) {
  if (tg === null || ac === null || isNaN(tg) || isNaN(ac)) return { raw: null, pos: 0, status: "annual" };
  const raw = rawAchievement(k, tg, ac);
  const pos = (raw === null || isNaN(raw)) ? 0 : Math.min(100, Math.max(0, raw));
  let status;
  if (metTarget(k, tg, ac)) status = "achieved";
  else if (raw === null || isNaN(raw)) status = "annual";
  else status = raw >= DB.settings.thresholds.green ? "achieved"
    : raw >= DB.settings.thresholds.amber ? "below" : "not";
  return { raw: raw, pos: pos, status: status };
}

/* Progress bars never render past their ends, however extreme the raw value. */
function displayProgress(k, q) {
  const a = achievement(k, q);
  if (a === null || isNaN(a)) return 0;
  return Math.min(100, Math.max(0, a));
}

function statusOf(k, q) {
  /* A status imported from the report wins until someone edits the KPI's numbers,
     at which point the threshold matrix takes over (cleared in saveKpi). */
  const qq = q || FILTERS.quarter || "ytd";
  if (!DB.settings.autoStatus && k.statusOverride && STATUS_META[k.statusOverride] && qq === "ytd") return k.statusOverride;
  if (k.notMeasured) return "annual";
  if (annualPending(k)) return "annual";
  const [tg, ac] = quarterPair(k, qq);
  if (tg === null || ac === null) return "annual";
  /* Meeting the target on its own polarity is decisive; the threshold matrix
     only grades how far short a missed target fell. */
  if (metTarget(k, tg, ac)) return "achieved";
  const a = achievement(k, q);
  if (a === null || a === undefined || isNaN(a)) return "annual";
  const g = DB.settings.thresholds.green, m = DB.settings.thresholds.amber;
  if (a >= g) return "achieved";
  if (a >= m) return "below";
  return "not";
}
const STATUS_META = {
  achieved: { key: "stAchieved", cls: "b-ok", color: "var(--ok)", hex: "#16A34A" },
  below: { key: "stBelow", cls: "b-warn", color: "var(--warn)", hex: "#E9A400" },
  not: { key: "stNot", cls: "b-bad", color: "var(--bad)", hex: "#E11D48" },
  annual: { key: "stAnnual", cls: "b-na", color: "var(--na)", hex: "#94A3B8" }
};
function statusFromThresholds(k, q) {
  if (annualPending(k)) return "annual";
  const [tg, ac] = quarterPair(k, q || FILTERS.quarter || "ytd");
  if (tg === null || ac === null) return "annual";
  if (metTarget(k, tg, ac)) return "achieved";
  const a = achievement(k, q);
  if (a === null || a === undefined || isNaN(a)) return "annual";
  return a >= DB.settings.thresholds.green ? "achieved" : a >= DB.settings.thresholds.amber ? "below" : "not";
}
const today = () => new Date().toISOString().slice(0, 10);
function taskDate(s) { return /^\d{4}-\d{2}-\d{2}/.test(String(s || "")) ? String(s).slice(0, 10) : null; }
/* "متأخرة" and "مواعيد قادمة" are derived from the due date, never stored. */
function isLate(x) { const d = taskDate(x.end); return !!d && x.status !== "done" && d < today(); }
function isUpcoming(x) {
  const d = taskDate(x.end); if (!d || x.status === "done") return false;
  const days = (new Date(d) - new Date(today())) / 86400000;
  return days >= 0 && days <= 7;
}
/* "late" is normally derived from the due date, but an administrator can also place
   a card in the column by hand; lateFlag records that and is cleared on any other move. */
const effStatus = x => (x.status !== "done" && (x.lateFlag || isLate(x))) ? "late" : x.status;
const PRIORITY_META = { high: { cls: "b-bad" }, medium: { cls: "b-warn" }, low: { cls: "b-na" } };
const prioLabel = p => { const x = EXTRA2.priorities.find(y => y.id === p); return x ? (LANG === "ar" ? x.ar : x.en) : p; };
const prioBadge = p => '<span class="badge ' + (PRIORITY_META[p] || PRIORITY_META.medium).cls + '">' + esc(prioLabel(p)) + '</span>';
const TASK_META = {
  done: { key: "tDone", cls: "b-ok", color: "var(--ok)" },
  progress: { key: "tProgress", cls: "b-warn", color: "var(--warn)" },
  late: { key: "tLate", cls: "b-bad", color: "var(--bad)" },
  planned: { key: "tPlanned", cls: "b-na", color: "var(--na)" }
};
const RECEIPT_META = {
  full: { key: "rFull", cls: "b-ok", color: "var(--ok)" },
  partial: { key: "rPartial", cls: "b-warn", color: "var(--warn)" },
  pending: { key: "rPending", cls: "b-na", color: "var(--na)" }
};
const taskBadge = s => '<span class="badge ' + TASK_META[s].cls + '"><i class="dot"></i>' + esc(t(TASK_META[s].key)) + '</span>';
const receiptBadge = s => '<span class="badge ' + RECEIPT_META[s].cls + '"><i class="dot"></i>' + esc(t(RECEIPT_META[s].key)) + '</span>';
const statusBadge = s => '<span class="badge ' + STATUS_META[s].cls + '"><i class="dot"></i>' + esc(t(STATUS_META[s].key)) + '</span>';

/* ---------- Lookups ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const inCategory = (k, cat) => k.category === cat || (k.alsoCategories || []).indexOf(cat) > -1;
const catName = id => { const c = byId(DB.categories, id); return c ? L(c) : t("unassigned"); };
const objName = id => { const o = byId(DB.objectives, id); return o ? (L(o) || o.code) : t("unassigned"); };
const orgName = id => { const o = byId(DB.organizations, id); return o ? L(o) : t("unassigned"); };
const secName = id => { const s = byId(DB.sectors, id); return s ? L(s) : t("unassigned"); };
const userName = id => { const u = byId(DB.users, id); return u ? L(u) : t("unassigned"); };

/* ---------- Filtering ---------- */
/* A category is either a real KPI table or a display-card section. Built-in
   sections keep their legacy group names; sections created by an administrator
   use their own id as the group. */
function catKind(c) { return (c && c.kind) || "table"; }
function isDisplayCat(c) { return catKind(c).indexOf("display") === 0; }
function catGroup(c) { return (c && c.group) || (c && c.id) || ""; }
function catExcluded(c) { return !!(c && c.excluded); }

function filtered() {
  const q = (FILTERS.q || "").trim().toLowerCase();
  return DB.kpis.filter(k => {
    if (VIEW.category && !inCategory(k, VIEW.category)) return false;
    if (!VIEW.category && !FILTERS.category && catExcluded(byId(DB.categories, k.category))) return false;
    if (FILTERS.category && !inCategory(k, FILTERS.category)) return false;
    if (FILTERS.objective && k.objective !== FILTERS.objective) return false;
    if (FILTERS.org && k.organization !== FILTERS.org) return false;
    if (FILTERS.sector && k.sector !== FILTERS.sector) return false;
    if (FILTERS.owner && !(k.owners || []).includes(FILTERS.owner)) return false;
    if (FILTERS.freq && k.frequency !== FILTERS.freq) return false;
    if (FILTERS.polarity && k.polarity !== FILTERS.polarity) return false;
    if (FILTERS.status && statusOf(k) !== FILTERS.status) return false;
    if (q) {
      const parts = [k.ar, k.en, k.definition, k.formula, k.notes, k.unit, k.dataSource];
      const push = (coll, id) => { const x = byId(coll, id); if (x) parts.push(x.ar, x.en, x.code, x.short); };
      push(DB.sectors, k.sector); push(DB.objectives, k.objective);
      push(DB.categories, k.category); push(DB.organizations, k.organization);
      (k.owners || []).forEach(o => push(DB.users, o));
      if (parts.filter(Boolean).join(" ").toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* ---------- Audit ---------- */
function logAudit(action, entity, field, oldV, newV) {
  const d = new Date();
  DB.audit.unshift({
    id: uid("a"), user: DB.currentUser, userName: L(currentUser()),
    ts: d.toISOString(),
    date: d.toISOString().slice(0, 10),
    time: d.toTimeString().slice(0, 8),
    action, entity, field: field || "",
    oldV: oldV === undefined ? "" : String(oldV ?? ""),
    newV: newV === undefined ? "" : String(newV ?? "")
  });
  if (DB.audit.length > 4000) DB.audit.length = 4000;
}
async function persist() { await Store.save(DB); }
async function commit(action, entity, field, oldV, newV) { logAudit(action, entity, field, oldV, newV); await persist(); }

/* ============================================================
   6. CHARTS (dependency-free SVG)
   ============================================================ */
function donut(slices, centerVal, centerLbl, size) {
  size = size || 230;
  const total = slices.reduce((s, x) => s + x.value, 0);
  const R = 76, C = 2 * Math.PI * R, cx = 100, cy = 100;
  let off = 0, paths = "";
  if (total === 0) {
    paths = '<circle cx="100" cy="100" r="76" fill="none" stroke="var(--na-soft)" stroke-width="30"/>';
  } else {
    slices.forEach((s, i) => {
      if (s.value <= 0) return;
      const len = (s.value / total) * C;
      paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + s.color +
        '" stroke-width="30" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 100 100)">' +
        '<title>' + esc(s.label) + ": " + s.value + '</title></circle>';
      off += len;
    });
  }
  return '<div class="donut-c"><svg viewBox="0 0 200 200" width="' + size + '" height="' + size + '" role="img">' + paths + '</svg>' +
    '<div class="donut-center"><b>' + esc(centerVal) + '</b><span>' + esc(centerLbl) + '</span></div></div>' +
    '<div class="legend">' + slices.map(s => '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + ' (' + s.value + ')</span>').join("") + '</div>';
}

function kpiCard(k) {

  const vr = fmtVariance(k);
  return '<div class="card kpi" data-kpi="' + k.id + '"' + (EDITMODE ? ' draggable="true"' : "") + '>' +
    (canSubmit(k) ? '<div class="edit-h">' + (pendingFor(k.id)
      ? '<span class="badge b-warn"><i class="dot"></i>' + esc(t("pendingReview")) + '</span>'
      : '<button class="iconbtn" data-submit="' + k.id + '" title="' + esc(t("submitValue")) + '">\u21a5</button>') + '</div>' : "") +
    (canEdit() ? '<div class="edit-h"><button class="iconbtn" data-act="edit" title="' + esc(t("edit")) + '">✎</button>' +
      '<button class="iconbtn del" data-act="del" title="' + esc(t("del")) + '">🗑</button></div>' : "") +

    '<div class="kmeta">' + statusBadge(s) +
    (k.category ? '<span class="pill">' + esc(catName(k.category)) + '</span>' : "") +
    (k.sector ? '<span class="pill">' + esc(secName(k.sector)) + '</span>' : "") +
    (k.polarity === "negative" ? '<span class="pill">▼ ' + (LANG === "ar" ? "سلبي" : "Negative") + '</span>' : "") +

    '<div class="kvals">' +
    '<div class="kv"><b>' + esc(fmtC(tg)) + '</b><span>' + esc(t("target")) + '</span></div>' +
    '<div class="kv"><b>' + esc(fmtC(ac)) + '</b><span>' + esc(t("actual")) + '</span></div>' +

    html += '<div class="card"><div class="card-h"><span class="card-t">' + esc(t("byStatus")) + '</span></div>' +

    }).filter(x => x.total);
    html += '<div class="card"><div class="card-h"><span class="card-t">' + esc(t("bySector")) + '</span></div>' +
      '<div class="card-b">' + ownerBars(secs) + '</div></div>';
  }
  html += '</div>';

  if (S.owners) {
    const members = DB.users.filter(u => u.role === "admin").sort((a, b) => a.order - b.order).map(u => {
      const own = list.filter(k => (k.owners || []).includes(u.id));
      return { name: L(u), total: own.length, done: own.filter(k => statusOf(k) === "achieved").length };
    });
    const anyAssigned = members.some(m => m.total);
    html += '<div class="card section"><div class="card-h"><span class="card-t">' + esc(t("byOwner")) + '</span></div>' +
      '<div class="card-b">' + (anyAssigned ? ownerBars(members) :
        '<div class="empty" style="padding:22px"><div class="et">' + esc(t("noOwnersYet")) + '</div>' +
        '<div class="es">' + esc(t("noOwnersBody")) + '</div>' +
        (canEdit() ? '<button class="tbtn primary" id="goAssignOwners">' + esc(t("assignOwners")) + '</button>' : "") + '</div>') +
      '</div></div>';
  }

  if (S.orgs) {
    const orgs = DB.organizations.slice().sort((a, b) => a.order - b.order).map(o => {
      const own = list.filter(k => k.organization === o.id);
      const cards = orgCardCount(o.id);
      return { name: L(o), total: own.length + cards, done: own.filter(k => statusOf(k) === "achieved").length };
    });
    html += '<div class="card section"><div class="card-h"><span class="card-t">' + esc(t("byOrg")) + '</span></div>' +
      '<div class="card-b">' + ownerBars(orgs) + '</div></div>';

  if (S.table && list.length) {
    html += '<div class="card section"><div class="card-h"><span class="card-t">' + esc(t("kpiTable")) + '</span>' +
      '<div class="spacer flexrow"><button class="tbtn" data-export="xlsx">⬇ ' + esc(t("exportExcel")) + '</button>' +
      '<button class="tbtn" data-export="pptx">⬇ ' + esc(t("exportPpt")) + '</button>' +
      '<button class="tbtn" data-export="pdf">🖨 ' + esc(t("exportPdf")) + '</button></div></div>' +
      registerTable(list) + '</div>';
  }
  return html;
}

/* Display-card sets (NDF impact indicators, SVC portfolio indicators) are KPIs owned by
   those bodies, so they count towards the owner totals and stay dynamic. */
const orgCardCount = id => DB.displayCards.filter(c => c.organization === id).length;
const orgKpiCount = id => DB.kpis.filter(k => k.organization === id).length + orgCardCount(id);
const pageOrgs = () => simpleListPage("org", DB.organizations, t("addOrg"),
  o => (o.short || "") + " · " + orgKpiCount(o.id) + " " + t("kpiCount"));
/* ---------- Sectors -------------------------------------------------
   Each sector is an entity card carrying the bank identity colours and a
   live count of its KPIs per status, and opens a drill-down of its own
   KPIs. Statuses come from the same engine used everywhere else, so the
   dots always agree with the register and the overview.
   -------------------------------------------------------------------- */
const BRAND_SEQ = ["var(--brand-navy)", "var(--brand-teal)", "var(--brand-lilac)", "var(--brand-grey)"];
const secColor = s => {
  if (s && s.color) return s.color;
  const i = DB.sectors.slice().sort((a, b) => a.order - b.order).findIndex(x => x.id === (s || {}).id);
  return BRAND_SEQ[(i < 0 ? 0 : i) % BRAND_SEQ.length];
};
const secKpis = id => DB.kpis.filter(k => k.sector === id);
function secCounts(id) {
  const c = { achieved: 0, below: 0, not: 0, annual: 0 };
  secKpis(id).forEach(k => { const s = statusOf(k); if (c[s] !== undefined) c[s]++; });
  return c;
}
const SEC_DOTS = ["achieved", "below", "not", "annual"];

function secDots(counts) {
  return '<div class="sc-dots">' + SEC_DOTS.map(s => {
    const m = STATUS_META[s], n = counts[s];
    return '<span class="sc-dot' + (n ? "" : " zero") + '" title="' + esc(t(m.key)) + '">' +
      '<i style="background:' + m.color + '"></i>' + n + '</span>';
  }).join("") + '</div>';
}
function secMiniBar(counts, total) {
  if (!total) return "";
  return '<div class="sc-mini">' + SEC_DOTS.map(s => counts[s]
    ? '<i style="width:' + (counts[s] / total * 100).toFixed(1) + '%;background:' + STATUS_META[s].color + '"></i>' : "")
    .join("") + '</div>';
}

function pageSectorDetail(s) {
  const list = secKpis(s.id), counts = secCounts(s.id), total = list.length, col = secColor(s);
  const share = n => total ? Math.round(n / total * 100) + "% " + t("ofTotal") : "—";
  let html = '<div class="flexrow section"><button class="tbtn" id="secBack">' +
    (LANG === "ar" ? "→ " : "← ") + esc(t("secBack")) + '</button></div>';

  html += '<div class="card section"><div class="card-b"><div class="secdetail-h">' +
    '<span class="sc-chip" style="--sc:' + col + '">' + esc((L(s) || "?").trim().charAt(0)) + '</span>' +
    '<div><div class="secdetail-t">' + esc(L(s)) + '</div>' +
    '<div class="secdetail-s">' + total + ' ' + esc(t("kpiCount")) + '</div></div>' +
    '<div style="margin-inline-start:auto">' + secDots(counts) + '</div></div>' +
    secMiniBar(counts, total) + '</div></div>';

  html += '<div class="grid g4 section">' +
    SEC_DOTS.map(k => statCard(t(STATUS_META[k].key), counts[k], share(counts[k]),
      total ? counts[k] / total * 100 : 0, STATUS_META[k].color)).join("") + '</div>';

function parseDelimited(text) {
  text = text.replace(/\r\n?/g, "\n").trim();
  if (!text) return [];
  const delim = (text.split("\n")[0].split("\t").length > text.split("\n")[0].split(",").length) ? "\t" : ",";
  const out = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); out.push(row); row = []; cell = ""; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x !== "")) out.push(row);
  return out;
}
const norm = s => String(s || "").toLowerCase().trim()
  .replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[ًٌٍَُِّْ]/g, "")
  .replace(/\s+/g, " ");
function autoMap(headers) {
  /* Score every (column, field) pair, then assign greedily so that each
     column takes one field and each field is claimed once. Exact header
     matches always win over partial ones. */
  const scored = [];
  headers.forEach((h, i) => {
    const low = norm(h); if (!low) return;
    for (const f in HEADER_HINTS) {
      HEADER_HINTS[f].forEach(hint => {
        const hl = norm(hint); let s = 0;
        if (low === hl) s = 1000 + hl.length;
        else if (low.startsWith(hl) || low.endsWith(hl)) s = 400 + hl.length;
        else if (low.indexOf(hl) > -1) s = 100 + hl.length;
        if (s) scored.push({ i: i, f: f, s: s });
      });
    }
  });
  scored.sort((a, b) => b.s - a.s);
  const map = {}, usedF = {}, usedI = {};
  scored.forEach(x => { if (usedI[x.i] || usedF[x.f]) return; map[x.i] = x.f; usedI[x.i] = 1; usedF[x.f] = 1; });
  if (Object.values(map).indexOf("ar") === -1 && Object.values(map).indexOf("en") === -1) map[0] = "ar";
  return map;
}

function ensureRef(coll, name, extra) {
  name = String(name || "").trim(); if (!name) return "";
  let f = coll.find(x => (x.ar || "").trim() === name || (x.en || "").trim() === name ||
    (x.short || "").trim().toLowerCase() === name.toLowerCase());
  if (f) return f.id;
  const o = Object.assign({ id: uid("x"), ar: name, en: name, order: coll.length + 1 }, extra || {});
  coll.push(o); return o.id;
}
async function runImport() {
  if (!requireAdmin()) return;
  const map = IMPORT_STATE.map, added = [];
  IMPORT_STATE.rows.forEach(r => {
    const rec = {};
    Object.keys(map).forEach(i => { if (map[i]) rec[map[i]] = String(r[i] == null ? "" : r[i]).trim(); });
    if (!rec.ar && !rec.en) return;
    const k = {
      id: uid("k"), ar: rec.ar || rec.en, en: rec.en || rec.ar, definition: rec.definition || "",
      objective: "", category: "", sector: "", organization: "", owners: [],
      frequency: rec.frequency || t("freqQ"),
      polarity: /سلب|neg|lower|أقل/i.test(rec.polarity || "") ? "negative" : "positive",
      unit: rec.unit || "", baseline: rec.baseline || "", annualTarget: rec.annualTarget || "",
      q1t: rec.q1t || "", q1a: rec.q1a || "", q2t: rec.q2t || "", q2a: rec.q2a || "",
      q3t: rec.q3t || "", q3a: rec.q3a || "", q4t: rec.q4t || "", q4a: rec.q4a || "",
      achOverride: rec.achOverride || "", formula: rec.formula || "", dataSource: rec.dataSource || "",
      challenges: rec.challenges || "", actions: rec.actions || "", notes: rec.notes || "",
      attachments: [], order: DB.kpis.length + added.length + 1,
      updatedAt: new Date().toISOString(), updatedBy: DB.currentUser
    };
    if (rec.objectiveName) {
      const nm = rec.objectiveName.trim();
      let o = DB.objectives.find(x => x.code.toLowerCase() === nm.toLowerCase() || (x.ar || "") === nm || (x.en || "") === nm);
      if (!o) { const empty = DB.objectives.find(x => !x.ar && !x.en); if (empty) { empty.ar = nm; empty.en = nm; o = empty; } }
      if (!o) { o = { id: uid("obj"), code: "O" + (DB.objectives.length + 1), ar: nm, en: nm, desc: "", color: ["#203864", "#54C1C8", "#A8A3C9", "#7F7F7F"][DB.objectives.length % 4], order: DB.objectives.length + 1 }; DB.objectives.push(o); }
      k.objective = o.id;
    }
    if (rec.categoryName) {
      const nm = rec.categoryName.trim();
      let c = DB.categories.find(x => (x.ar || "").includes(nm) || (x.en || "").toLowerCase().includes(nm.toLowerCase()) || nm.includes(x.ar || "\u0000"));
      if (!c) { c = { id: uid("cat"), ar: nm, en: nm, icon: "◇", order: DB.categories.length + 1 }; DB.categories.push(c); }
      k.category = c.id;
    }
    if (rec.sectorName) k.sector = ensureRef(DB.sectors, rec.sectorName);
    if (rec.orgName) k.organization = ensureRef(DB.organizations, rec.orgName, { short: rec.orgName });
    if (rec.ownerName) {
      rec.ownerName.split(/[،,\/|]/).map(s => s.trim()).filter(Boolean).forEach(nm => {
        let u = DB.users.find(x => (x.ar || "") === nm || (x.en || "") === nm);
        if (!u) { u = { id: uid("u"), ar: nm, en: nm, titleAr: "", titleEn: "", showTitle: false, role: "admin", order: DB.users.length + 1 }; DB.users.push(u); }
        k.owners.push(u.id);
      });
    }
    DB.kpis.push(k); added.push(k.ar);
  });
  logAudit("import", t("navData"), "", "", added.length + " " + t("kpiCount"));
  await persist();
  toast(t("importDone") + " — " + added.length, "ok");
  IMPORT_STATE = { rows: [], headers: [], map: {} };
  VIEW.page = "kpis"; VIEW.category = null; render();
}
/* ============================================================

   Monthly activity log and the quarterly sector report tracker,
   sourced from the corporate performance team's workbook.

let TASK_TAB = "monthly";
let TASK_MONTH = 0;   /* 0 = all months */
let RECEIPT_Q = "q2";  /* active quarter in the sector report tracker */

function taskStats(list) {
  return {
    total: list.length,
    done: list.filter(x => x.status === "done").length,
    open: list.filter(x => x.status !== "done").length
  };
}

function pageTasks() {
  const tab = (id, lbl) => '<button class="tab' + (TASK_TAB === id ? " active" : "") + '" data-ttab="' + id + '">' + esc(lbl) + '</button>';
  if (TASK_TAB === "method") TASK_TAB = "monthly";   /* methodology notes retired */
  let html = '<div class="card section"><div class="tabs" style="border-radius:14px 14px 0 0">' +
    tab("monthly", t("tabMonthly")) + tab("receipt", t("tabReceipt")) +
    '</div><div class="card-b">' +
    (TASK_TAB === "receipt" ? tasksReceipt() : tasksMonthly()) +
    '</div></div>';
  return html;
}

let TASK_VIEW = "kanban";
let TASK_FILTER = { status: "", owner: "", priority: "" };
let CAL_MONTH = 7;

function visibleTasks() {
  return DB.tasks.slice()
    .filter(x => !TASK_MONTH || x.monthNo === TASK_MONTH)
    .filter(x => !TASK_FILTER.status || effStatus(x) === TASK_FILTER.status)
    .filter(x => !TASK_FILTER.owner || x.assignee === TASK_FILTER.owner)
    .filter(x => !TASK_FILTER.priority || x.priority === TASK_FILTER.priority)
    .filter(x => !FILTERS.q || (x.ar + " " + x.details).toLowerCase().indexOf(FILTERS.q.toLowerCase()) > -1)
    .sort((a, b) => (a.monthNo - b.monthNo) || (a.order - b.order));
}

function tasksMonthly() {
  const months = EXTRA_DATA.months.slice().sort((a, b) => a.no - b.no);
  const list = visibleTasks();
  const all = DB.tasks;
  const S = {
    total: all.length,
    done: all.filter(x => x.status === "done").length,
    progress: all.filter(x => effStatus(x) === "progress").length,
    late: all.filter(x => isLate(x)).length,
    soon: all.filter(x => isUpcoming(x)).length
  };
  const card = (lbl, val, tone) => '<div class="card stat"><div class="ring"></div>' +
    '<div class="lbl">' + esc(lbl) + '</div><div class="val" style="color:' + tone + '">' + val + '</div>' +
    '<div class="bar"><i style="width:' + (S.total ? Math.round(val / S.total * 100) : 0) + '%"></i></div></div>';

  let html = '<div class="grid g5 section">' +
    card(t("tasksTotal"), S.total, "var(--ink)") +
    card(t("tDone"), S.done, "var(--ok)") +
    card(t("tProgress"), S.progress, "var(--accent-b)") +
    card(t("tasksLate"), S.late, "var(--bad)") +
    card(t("tasksUpcoming"), S.soon, "var(--warn)") +
    '</div>';

  const vbtn = (id, lbl) => '<button class="segbtn' + (TASK_VIEW === id ? " on" : "") + '" data-tview="' + id + '">' + esc(lbl) + '</button>';
  html += '<div class="flexrow section" style="justify-content:space-between">' +
    '<div class="seg">' + vbtn("kanban", t("kanban")) + vbtn("list", t("listView")) +
    vbtn("calendar", t("calendarView")) + vbtn("progress", t("progressView")) + '</div>' +
    (canEdit() ? '<button class="tbtn primary" id="addTask">＋ ' + esc(t("addTask")) + '</button>' : "") +
    '</div>';

  const sel = (key, label, opts) => '<select data-tf="' + key + '"><option value="">' + esc(label) + '</option>' + opts + '</select>';
  html += '<div class="flexrow section">' +
    '<select id="taskMonth"><option value="0">' + esc(t("all")) + '</option>' +
    months.map(m => '<option value="' + m.no + '"' + (TASK_MONTH === m.no ? " selected" : "") + '>' +
      esc(LANG === "ar" ? m.ar : m.en) + ' 2026 (' + DB.tasks.filter(x => x.monthNo === m.no).length + ')</option>').join("") + '</select>' +
    sel("status", t("allStatuses"), Object.keys(TASK_META).map(k =>
      '<option value="' + k + '"' + (TASK_FILTER.status === k ? " selected" : "") + '>' + esc(t(TASK_META[k].key)) + '</option>').join("")) +
    sel("owner", t("allOwners"), DB.users.map(u =>
      '<option value="' + u.id + '"' + (TASK_FILTER.owner === u.id ? " selected" : "") + '>' + esc(L(u)) + '</option>').join("")) +
    sel("priority", t("allPriorities"), EXTRA2.priorities.map(p =>
      '<option value="' + p.id + '"' + (TASK_FILTER.priority === p.id ? " selected" : "") + '>' + esc(LANG === "ar" ? p.ar : p.en) + '</option>').join("")) +
    '<button class="tbtn" id="taskReset">' + esc(t("reset")) + '</button></div>';

  html += TASK_VIEW === "kanban" ? taskKanban(list)
    : TASK_VIEW === "list" ? taskList(list)
    : TASK_VIEW === "calendar" ? taskCalendar(list)
    : taskProgress(list);
  return html;
}

function taskCard(x) {
  const st = effStatus(x);
  return '<div class="tcard" data-task="' + x.id + '" draggable="true">' +
    '<div class="tc-top">' + prioBadge(x.priority || "medium") +
    (canEdit() ? '<span class="ract"><button class="iconbtn" data-r="task" data-id="' + x.id + '" data-act="edit">✎</button>' +
      '<button class="iconbtn del" data-r="task" data-id="' + x.id + '" data-act="del">🗑</button></span>' : "") + '</div>' +
    '<div class="tc-name">' + esc(L(x)) + '</div>' +
    (x.details ? '<div class="tc-det">' + esc(x.details.slice(0, 120)) + (x.details.length > 120 ? "…" : "") + '</div>' : "") +
    '<div class="tc-bar"><i style="width:' + (+x.progress || 0) + '%;background:' + TASK_META[st].color + '"></i></div>' +
    '<div class="tc-foot">' +
    '<span>' + (x.assignee ? '<span class="avatar sm">' + esc(userName(x.assignee).charAt(0)) + '</span>' + esc(userName(x.assignee)) : '<span class="muted">' + esc(t("unassignedTask")) + '</span>') + '</span>' +
    '<span class="muted">' + (taskDate(x.end) ? esc(x.end) : esc(x.end || t("noDue"))) + '</span>' +

function taskKanban(list) {
  const cols = ["planned", "progress", "late", "done"];
  return '<div class="kanban" id="kanban">' + cols.map(c => {
    const set = list.filter(x => effStatus(x) === c);
    return '<div class="kcol" data-kcol="' + c + '">' +
      '<div class="kcol-h">' + taskBadge(c) + '<span class="cntpill">' + set.length + '</span></div>' +
      '<div class="kcol-b">' + (set.length ? set.map(taskCard).join("") :
        '<div class="muted center" style="padding:18px;font-size:12px">' + esc(t("shEmpty")) + '</div>') + '</div></div>';
  }).join("") + '</div>' +
  (canEdit() ? '<div class="muted mt">↔ ' + esc(t("moveTask")) + '</div>' : "");
}

function taskList(list) {
  if (!list.length) return '<div class="card"><div class="empty"><div class="et">' + esc(t("shEmpty")) + '</div></div></div>';
  return '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    ['taskName', 'taskMonth', 'taskStart', 'taskEnd', 'taskPriority', 'taskOwner', 'taskProgress', 'fStatus']
      .map(h => '<th>' + esc(t(h)) + '</th>').join("") + (canEdit() ? '<th></th>' : "") +
    '</tr></thead><tbody>' + list.map(x => '<tr data-task="' + x.id + '">' +
      '<td style="white-space:normal;font-weight:600;max-width:340px">' + esc(L(x)) +
      (x.details ? '<div class="muted" style="font-weight:400;margin-top:3px">' + esc(x.details.slice(0, 90)) + '</div>' : "") + '</td>' +
      '<td>' + esc(x.month) + '</td><td class="mono">' + esc(x.start || "—") + '</td><td class="mono">' + esc(x.end || "—") + '</td>' +
      '<td>' + prioBadge(x.priority || "medium") + '</td>' +
      '<td>' + esc(x.assignee ? userName(x.assignee) : t("unassignedTask")) + '</td>' +
      '<td style="min-width:110px"><div class="owner-bar"><i style="width:' + (+x.progress || 0) + '%"></i></div>' +
      '<span class="muted">' + (+x.progress || 0) + '%</span></td>' +
      '<td>' + taskBadge(effStatus(x)) + '</td>' +
      (canEdit() ? '<td><button class="iconbtn" data-r="task" data-id="' + x.id + '" data-act="edit">✎</button></td>' : "") +
      '</tr>').join("") + '</tbody></table></div></div>';
}

function taskCalendar(list) {
  const months = EXTRA_DATA.months.slice().sort((a, b) => a.no - b.no);
  const mn = TASK_MONTH || CAL_MONTH;
  const m = months.find(x => x.no === mn) || months[0];
  const first = new Date(2026, mn - 1, 1);
  const days = new Date(2026, mn, 0).getDate();
  const lead = first.getDay();                       /* 0 = Sunday, the Saudi week start */
  const dow = LANG === "ar" ? ["أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"]
                            : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const byDay = {};
  list.forEach(x => {
    const d = taskDate(x.end) || taskDate(x.start);
    if (!d) return;
    const dt = new Date(d);
    if (dt.getMonth() + 1 !== mn) return;
    (byDay[dt.getDate()] = byDay[dt.getDate()] || []).push(x);
  });
  const undated = list.filter(x => !taskDate(x.end) && !taskDate(x.start));
  let cells = "";
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell empty-cell"></div>';
  for (let d = 1; d <= days; d++) {
    const set = byDay[d] || [];
    cells += '<div class="cal-cell"><div class="cal-d">' + d + '</div>' +
      set.map(x => '<div class="cal-t" data-task="' + x.id + '" style="border-inline-start-color:' + TASK_META[effStatus(x)].color + '" title="' + esc(L(x)) + '">' +
        esc(L(x).slice(0, 34)) + '</div>').join("") + '</div>';
  }
  return '<div class="card"><div class="card-h"><span class="card-t">' +
    esc((LANG === "ar" ? m.ar : m.en) + " 2026") + '</span></div><div class="card-b">' +
    '<div class="cal-grid">' + dow.map(x => '<div class="cal-dow">' + esc(x) + '</div>').join("") + cells + '</div>' +
    (undated.length ? '<div class="mt"><div class="muted" style="font-weight:700;margin-bottom:6px">' + esc(t("noDue")) + ' (' + undated.length + ')</div>' +
      '<div class="flexrow">' + undated.map(x => '<span class="pill" data-task="' + x.id + '">' + esc(L(x).slice(0, 40)) + '</span>').join("") + '</div></div>' : "") +
    '</div></div>';
}

function taskProgress(list) {
  const people = DB.users.slice().sort((a, b) => a.order - b.order)
    .map(u => ({ name: L(u), set: list.filter(x => x.assignee === u.id) }))
    .concat([{ name: t("unassignedTask"), set: list.filter(x => !x.assignee) }])
    .filter(x => x.set.length);
  const months = EXTRA_DATA.months.slice().sort((a, b) => a.no - b.no)
    .map(m => ({ name: (LANG === "ar" ? m.ar : m.en), set: list.filter(x => x.monthNo === m.no) }))
    .filter(x => x.set.length);
  const block = (title, rows) => '<div class="card"><div class="card-h"><span class="card-t">' + esc(title) + '</span></div>' +
    '<div class="card-b">' + (rows.length ? rows.map(r => {
      const avg = r.set.reduce((a, x) => a + (+x.progress || 0), 0) / r.set.length;
      const done = r.set.filter(x => x.status === "done").length;
      return '<div class="owner-row"><div class="owner-top"><span class="owner-n">' + esc(r.name) + '</span>' +
        '<span class="owner-v">' + done + '/' + r.set.length + ' · ' + Math.round(avg) + '%</span></div>' +
        '<div class="owner-bar"><i style="width:' + avg.toFixed(1) + '%"></i></div></div>';
    }).join("") : '<div class="muted center">' + esc(t("shEmpty")) + '</div>') + '</div></div>';
  return '<div class="grid g2">' + block(t("byOwner"), people) + block(t("taskMonth"), months) + '</div>';
}

function tasksReceipt() {

  /* Quarter picker \u2014 every quarter carries its own status and note. */
  const picker = '<div class="flexrow section">' + qs.map(q =>
    '<button class="segbtn' + (RECEIPT_Q === q[0] ? " on" : "") + '" data-rq="' + q[0] + '">' + esc(q[1]) + '</button>'
  ).join("") + '</div>';

  const summary = '<div class="flexrow section" style="gap:14px">' + qs.map(q => {
    const l = DB.receipt[q[0]] || [];
    return '<div><div class="muted" style="margin-bottom:5px;font-weight:700">' + esc(q[1]) + '</div><div class="flexrow">' +
      Object.keys(RECEIPT_META).map(k => '<span class="badge ' + RECEIPT_META[k].cls + '"><i class="dot"></i>' +
        esc(t(RECEIPT_META[k].key)) + ': ' + l.filter(x => x.state === k).length + '</span>').join(" ") +
      '</div></div>';
  }).join("") + '</div>';

  const stateCell = r => editable
    ? '<select class="rcsel" data-rq-set="' + esc(r.id) + '">' +
      Object.keys(RECEIPT_META).map(k => '<option value="' + k + '"' + (r.state === k ? " selected" : "") + '>' +
        esc(t(RECEIPT_META[k].key)) + '</option>').join("") + '</select>'
    : receiptBadge(r.state);

  const noteCell = r => editable
    ? '<input class="rcnote" data-rq-note="' + esc(r.id) + '" value="' + esc(r.note || "") + '" placeholder="' + esc(t("receiptNote")) + '">'
    : '<span class="muted">' + esc(r.note || "\u2014") + '</span>';

  const table = '<div class="tbl-wrap"><table class="tbl" style="min-width:700px"><thead><tr>' +
    '<th style="width:34%">' + esc(t("receiptSector")) + '</th>' +
    '<th style="width:22%">' + esc(t("receiptState")) + ' \u2014 ' + esc(qs.filter(q => q[0] === RECEIPT_Q)[0][1]) + '</th>' +
    '<th>' + esc(t("receiptNote")) + '</th></tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr><td style="font-weight:600;white-space:normal">' + esc(r.sector) + '</td>' +
      '<td>' + stateCell(r) + '</td><td style="white-space:normal">' + noteCell(r) + '</td></tr>').join("")
      : '<tr><td colspan="3" class="muted center" style="padding:20px">' + esc(t("noData")) + '</td></tr>') +
    '</tbody></table></div>';

  return picker + summary + table +
    (editable ? '<div class="muted mt">' + esc(t("receiptHint")) + '</div>' : "");
}

/* ---------- task editor ---------- */
function editTask(id) {
  if (!requireAdmin()) return;
  const isNew = !id;
  let x = isNew ? { id: uid("t"), ar: "", en: "", month: EXTRA_DATA.months[2].ar, monthNo: 7, start: "", end: "", status: "planned", statusText: "", details: "", owner: "", assignee: "", priority: "medium", progress: 0, order: DB.tasks.length + 1 } : byId(DB.tasks, id);
  const before = JSON.parse(JSON.stringify(x));
  const months = EXTRA_DATA.months.slice().sort((a, b) => a.no - b.no);
  openModal('<div class="modal-h"><span class="modal-t">' + esc(isNew ? t("addTask") : t("editTask")) + '</span>' +
    '<button class="iconbtn spacer" id="mClose">✕</button></div><div class="modal-b"><div class="form-grid" style="grid-template-columns:1fr 1fr">' +
    '<div class="fld wide"><label>' + esc(t("taskName")) + '</label><input data-e="ar" value="' + esc(x.ar) + '"></div>' +
    '<div class="fld"><label>' + esc(t("taskMonth")) + '</label><select data-e="monthNo">' +
    months.map(m => '<option value="' + m.no + '"' + (x.monthNo === m.no ? " selected" : "") + '>' + esc(LANG === "ar" ? m.ar : m.en) + '</option>').join("") + '</select></div>' +
    '<div class="fld"><label>' + esc(t("fStatus")) + '</label><select data-e="status">' +
    Object.keys(TASK_META).map(k => '<option value="' + k + '"' + (x.status === k ? " selected" : "") + '>' + esc(t(TASK_META[k].key)) + '</option>').join("") + '</select></div>' +
    '<div class="fld"><label>' + esc(t("taskStart")) + '</label><input data-e="start" value="' + esc(x.start) + '"></div>' +
    '<div class="fld"><label>' + esc(t("taskEnd")) + '</label><input data-e="end" value="' + esc(x.end) + '"></div>' +
    '<div class="fld"><label>' + esc(t("taskPriority")) + '</label><select data-e="priority">' +
    EXTRA2.priorities.map(p => '<option value="' + p.id + '"' + (x.priority === p.id ? " selected" : "") + '>' + esc(LANG === "ar" ? p.ar : p.en) + '</option>').join("") + '</select></div>' +
    '<div class="fld"><label>' + esc(t("taskProgress")) + ' (%)</label><input type="number" min="0" max="100" data-e="progress" value="' + (+x.progress || 0) + '"></div>' +
    '<div class="fld wide"><label>' + esc(t("taskOwner")) + '</label><select data-e="assignee"><option value="">' + esc(t("unassignedTask")) + '</option>' +
    DB.users.map(u => '<option value="' + u.id + '"' + (x.assignee === u.id ? " selected" : "") + '>' + esc(L(u)) + '</option>').join("") + '</select></div>' +
    '<div class="fld wide"><label>' + esc(t("taskDetails")) + '</label><textarea data-e="details">' + esc(x.details) + '</textarea></div>' +
    '</div></div><div class="modal-f"><button class="tbtn" id="eCancel">' + esc(t("cancel")) + '</button>' +
    '<button class="tbtn primary" id="eSave">' + esc(t("save")) + '</button></div>', "sm");
  $("#mClose").onclick = $("#eCancel").onclick = closeModal;
  $("#eSave").onclick = async () => {
    $$("[data-e]").forEach(el => { x[el.dataset.e] = (el.dataset.e === "monthNo" || el.dataset.e === "progress") ? +el.value : el.value; });
    const m = EXTRA_DATA.months.find(mm => mm.no === x.monthNo); if (m) x.month = m.ar;
    if (x.status === "done") x.progress = 100;
    else if (x.progress >= 100) x.progress = 99;
    if (!x.ar) { toast(t("noData"), "err"); return; }
    if (isNew) { DB.tasks.push(x); logAudit("add", t("navTasks"), x.ar, "", x.ar); }
    else Object.keys(x).forEach(f => { if (String(before[f] ?? "") !== String(x[f] ?? "")) logAudit("edit", t("navTasks") + " · " + x.ar, f, before[f], x[f]); });
    await persist(); closeModal(); toast(t("savedOk"), "ok"); render();
  };
}
function deleteTask(id) {
  if (!requireAdmin()) return;
  const x = byId(DB.tasks, id); if (!x) return;
  confirmDialog(t("confirmDelete"), async () => {

/* ============================================================
   21. EXPORT ENGINE
   Real .xlsx and .pptx packages are assembled in the browser: an
   OOXML part tree zipped with a minimal store-only ZIP writer.
   PDF goes through the browser's own print pipeline, which is the
   only route that renders Arabic shaping and RTL correctly.
   ============================================================ */
const Zip = (() => {
  const TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  const crc32 = buf => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  const enc = new TextEncoder();
  function dosTime(d) {
    return { t: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() / 2)) & 0xFFFF,
             d: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF };
  }
  /* files: [{ name, data: string|Uint8Array }] — stored uncompressed (method 0). */
  function build(files) {
    const now = dosTime(new Date());
    const chunks = [], central = [];
    let offset = 0;
    files.forEach(f => {
      const nameB = enc.encode(f.name);
      const body = typeof f.data === "string" ? enc.encode(f.data) : f.data;
      const crc = crc32(body);
      const local = new Uint8Array(30 + nameB.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true); lv.setUint16(10, now.t, true); lv.setUint16(12, now.d, true);
      lv.setUint32(14, crc, true); lv.setUint32(18, body.length, true); lv.setUint32(22, body.length, true);
      lv.setUint16(26, nameB.length, true); lv.setUint16(28, 0, true);
      local.set(nameB, 30);
      chunks.push(local, body);
      const cen = new Uint8Array(46 + nameB.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
      cv.setUint16(12, now.t, true); cv.setUint16(14, now.d, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, body.length, true); cv.setUint32(24, body.length, true);
      cv.setUint16(28, nameB.length, true);
      cv.setUint32(42, offset, true);
      cen.set(nameB, 46);
      central.push(cen);
      offset += local.length + body.length;
    });
    const cenSize = central.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cenSize, true); ev.setUint32(16, offset, true);
    const total = offset + cenSize + 22;
    const out = new Uint8Array(total);
    let p = 0;
    chunks.forEach(c => { out.set(c, p); p += c.length; });
    central.forEach(c => { out.set(c, p); p += c.length; });
    out.set(end, p);
    return out;
  }
  return { build };
})();

function saveBinary(name, bytes, mime) {
  const blob = new Blob([bytes], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
}
const xml = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

/* ============================================================
   22. EXCEL  (.xlsx)
   ============================================================ */
function sheetXml(rows, widths, rtl) {
  const colTag = widths && widths.length
    ? '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + '</cols>' : "";
  const cellRef = (r, c) => {
    let s = "", n = c + 1;
    while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s + (r + 1);
  };
  const body = rows.map((row, ri) => '<row r="' + (ri + 1) + '">' + row.map((cell, ci) => {
    const v = cell && typeof cell === "object" ? cell.v : cell;
    const style = cell && typeof cell === "object" ? (cell.s || 0) : (ri === 0 ? 1 : 0);
    const ref = cellRef(ri, ci);
    if (v === null || v === undefined || v === "") return '<c r="' + ref + '" s="' + style + '"/>';
    if (typeof v === "number" && isFinite(v)) return '<c r="' + ref + '" s="' + style + '"><v>' + v + '</v></c>';
    return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + xml(v) + '</t></is></c>';
  }).join("") + '</row>').join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetViews><sheetView workbookViewId="0"' + (rtl ? ' rightToLeft="1"' : "") + '/></sheetViews>' +
    '<sheetFormatPr defaultRowHeight="15"/>' + colTag +
    '<sheetData>' + body + '</sheetData></worksheet>';
}
